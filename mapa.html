<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de temperatura superficial</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; }
    body { display: flex; flex-direction: column; }

    .barra {
      display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
      padding: 10px 16px; border-bottom: 1px solid #c8c8c8; background: #fff;
    }
    .barra label { font-size: 0.95rem; }
    .barra input[type="month"] { padding: 6px 8px; border: 1px solid #c8c8c8; border-radius: 4px; font-size: 1rem; }
    #coords { font-size: 0.95rem; margin-left: auto; }
    .volver { color: #1a1a1a; text-decoration: none; padding: 6px 10px; border: 1px solid #c8c8c8; border-radius: 4px; font-size: 0.95rem; }
    .volver:hover { background: #f4f4f4; }
    .boton { padding: 6px 10px; border: 1px solid #c8c8c8; border-radius: 4px; background: #fff; font-size: 0.95rem; cursor: pointer; }
    .boton:hover { background: #f4f4f4; }
    #slider { flex: 1; min-width: 160px; max-width: 520px; }
    #etiqueta { min-width: 5.5em; font-variant-numeric: tabular-nums; }

    #mapa { flex: 1; min-height: 0; }
    .leyenda { background: #fff; padding: 6px; border: 1px solid #c8c8c8; border-radius: 4px; }
    .leyenda img { display: block; height: 220px; }
    .leyenda small { display: block; font-size: 11px; margin-top: 4px; max-width: 135px; }
  </style>
</head>
<body>

  <div class="barra">
    <a href="index.html" class="volver">&larr; Inicio</a>
    <button type="button" id="play" class="boton" aria-label="Reproducir">&#9654; Reproducir</button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Mes">
    <strong id="etiqueta">--</strong>
    <span id="coords">Haz clic en el mapa para ver coordenadas.</span>
  </div>

  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CAPA = 'MODIS_Terra_L3_Land_Surface_Temp_Monthly_Day';
    const MATRIZ = 'GoogleMapsCompatible_Level6';
    const BASE = 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best';

    const mapa = L.map('mapa').setView([13.7, -88.9], 5);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);

    function urlCapa(mes) {
      return `${BASE}/${CAPA}/default/${mes}-01/${MATRIZ}/{z}/{y}/{x}.png`;
    }

    // Capa de temperatura (zoom nativo hasta 6; más allá se amplía la imagen)
    let capaTemp = L.tileLayer(urlCapa('2026-10'), {
      maxNativeZoom: 6,
      maxZoom: 12,
      opacity: 0.75,
      attribution: 'NASA GIBS / MODIS Terra LST'
    }).addTo(mapa);

    // Serie temporal mensual (según el catálogo de GIBS: 2000-03 a 2026-10)
    const INICIO = { y: 2000, m: 3 };
    const FIN = { y: 2026, m: 10 };
    const maxIndice = (FIN.y - INICIO.y) * 12 + (FIN.m - INICIO.m);

    function mesDeIndice(i) {
      const n = INICIO.m - 1 + i;
      const y = INICIO.y + Math.floor(n / 12);
      const m = (n % 12) + 1;
      return `${y}-${String(m).padStart(2, '0')}`;
    }

    const slider = document.getElementById('slider');
    const etiqueta = document.getElementById('etiqueta');
    const botonPlay = document.getElementById('play');
    slider.max = maxIndice;
    slider.value = maxIndice;
    etiqueta.textContent = mesDeIndice(maxIndice);

    let espera = null;
    function mostrar(i) {
      const mes = mesDeIndice(i);
      etiqueta.textContent = mes;
      clearTimeout(espera);
      espera = setTimeout(() => capaTemp.setUrl(urlCapa(mes)), 150); // evita pedir teselas en cada pixel
    }

    slider.addEventListener('input', () => mostrar(Number(slider.value)));

    // Reproducción automática
    let timer = null;
    function parar() {
      clearInterval(timer);
      timer = null;
      botonPlay.innerHTML = '&#9654; Reproducir';
    }
    botonPlay.addEventListener('click', () => {
      if (timer) { parar(); return; }
      botonPlay.innerHTML = '&#10074;&#10074; Pausar';
      if (Number(slider.value) >= maxIndice) slider.value = 0;
      timer = setInterval(() => {
        const sig = Number(slider.value) + 1;
        if (sig > maxIndice) { parar(); return; }
        slider.value = sig;
        mostrar(sig);
      }, 1200);
    });

    // Leyenda oficial de GIBS
    const leyenda = L.control({ position: 'bottomright' });
    leyenda.onAdd = function () {
      const div = L.DomUtil.create('div', 'leyenda');
      div.innerHTML =
        '<img src="https://gibs.earthdata.nasa.gov/legends/MODIS_Land_Surface_Temp_V.svg" alt="Leyenda de temperatura">' +
        '<small>Temperatura superficial (promedio mensual, diurna)</small>';
      return div;
    };
    leyenda.addTo(mapa);

    // Coordenadas al hacer clic
    let marcador = null;
    mapa.on('click', (e) => {
      const { lat, lng } = e.latlng;
      document.getElementById('coords').textContent =
        `Lat: ${lat.toFixed(4)}°, Lon: ${lng.toFixed(4)}°`;
      if (marcador) marcador.remove();
      marcador = L.circleMarker([lat, lng], { radius: 6, color: '#d32f2f' }).addTo(mapa);
    });
  </script>
</body>
</html>

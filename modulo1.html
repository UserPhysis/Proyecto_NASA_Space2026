<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo 1 · Variables ambientales</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="modulo1.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="volver">&larr; Inicio</a>
    <h1>Módulo 1 · Variables ambientales</h1>
    <span id="coords">Sin punto seleccionado</span>
  </header>

  <main class="contenido">

    <aside class="menu" aria-label="Variables">
      <p class="menu-titulo">Mapas</p>
      <button type="button" class="opcion activa" data-vista="mapa" data-capa="temp">Temperatura superficial</button>
      <button type="button" class="opcion" data-vista="mapa" data-capa="imerg">Precipitación diaria</button>
      <button type="button" class="opcion" data-vista="mapa" data-capa="merra">Precipitación mensual</button>
      <button type="button" class="opcion" data-vista="mapa" data-capa="evi">Vegetación (EVI)</button>
      <button type="button" class="opcion" data-vista="mapa" data-capa="smap">Humedad del suelo</button>

      <p class="menu-titulo">Gráficas</p>
      <button type="button" class="opcion" data-vista="grafica">Climograma del punto</button>

      <div class="descripcion" id="descripcion"></div>
    </aside>

    <section class="vista">

      <div id="vista-mapa" class="vista-mapa">
        <div id="mapa"></div>
        <div class="tiempo">
          <button type="button" id="play" class="boton">&#9654; Reproducir</button>
          <input type="range" id="slider" min="0" max="0" value="0" aria-label="Fecha">
          <strong id="etiqueta">--</strong>
        </div>
      </div>

      <div id="vista-grafica" class="vista-grafica" hidden>
        <h2 id="grafica-titulo">Climograma</h2>
        <div class="lienzo"><canvas id="climograma"></canvas></div>
        <p id="grafica-nota" class="nota"></p>
      </div>

    </section>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="modulo1.js"></script>
</body>
</html>
